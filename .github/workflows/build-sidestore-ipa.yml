name: SideStore Nightly ExtensionKit IPA

on:
  push:
    branches: [build/sidestore-nightly-extensionkit]

permissions:
  contents: read

env:
  SIDESTORE_COMMIT: d97ec133719d79916675bdaf722b82a8d091d545
  SIDESIGN_COMMIT: 14082dde804e03fbd93de7e34b6edb570d4bb9af
  MARKETING_VERSION: 0.7.0-20261018.custom+14082dd

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout SideStore source
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: d97ec133719d79916675bdaf722b82a8d091d545
          path: sidestore
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Fetch and pin SideSign
        shell: bash
        run: |
          set -euo pipefail
          SIDESIGN_PATH="$GITHUB_WORKSPACE/sidestore/Dependencies/SideSign"
          git -C "$SIDESIGN_PATH" fetch --no-tags \
            https://github.com/dddd-zdf/SideSign.git \
            refs/heads/fix/extensionkit-discovery
          git -C "$SIDESIGN_PATH" checkout --detach "$SIDESIGN_COMMIT"

      - name: Verify source revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sidestore rev-parse HEAD)" = "$SIDESTORE_COMMIT"
          test "$(git -C sidestore/Dependencies/SideSign rev-parse HEAD)" = "$SIDESIGN_COMMIT"
          printf 'SideStore: %s\nSideSign: %s\n' \
            "$(git -C sidestore rev-parse HEAD)" \
            "$(git -C sidestore/Dependencies/SideSign rev-parse HEAD)"

      - name: Install build tools
        shell: bash
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Set build version
        shell: bash
        working-directory: sidestore
        run: python3 scripts/ci/workflow.py set-marketing-version "$MARKETING_VERSION"

      - name: Build, fake-sign, and package
        shell: bash
        working-directory: sidestore
        run: |
          set -euo pipefail
          mkdir -p build/logs
          NSUnbufferedIO=YES make -B build \
            2>&1 | tee -a build/logs/build.log | xcbeautify --renderer github-actions
          make fakesign 2>&1 | tee -a build/logs/build.log
          make ipa 2>&1 | tee -a build/logs/build.log

      - name: Validate IPA
        shell: bash
        working-directory: sidestore
        run: |
          set -euo pipefail
          test -s SideStore.ipa
          unzip -t SideStore.ipa

          python3 - "SideStore.ipa" "$MARKETING_VERSION" <<'PY'
          import plistlib
          import sys
          import zipfile

          ipa_path, expected_version = sys.argv[1:]
          info_path = "Payload/SideStore.app/Info.plist"
          required_paths = {
              "Payload/SideStore.app/SideStore",
              "Payload/SideStore.app/Info.plist",
              "Payload/SideStore.app/PlugIns/AltWidgetExtension.appex/AltWidgetExtension",
              "Payload/SideStore.app/SideBackup.ipa",
          }
          with zipfile.ZipFile(ipa_path) as ipa:
              names = set(ipa.namelist())
              missing = required_paths - names
              assert not missing, sorted(missing)
              profiles = [name for name in names if name.lower().endswith("embedded.mobileprovision")]
              assert not profiles, profiles
              info = plistlib.loads(ipa.read(info_path))

          identifier = info.get("CFBundleIdentifier")
          version = info.get("CFBundleShortVersionString")
          assert identifier == "com.SideStore.SideStore", identifier
          assert version == expected_version, (version, expected_version)
          print(f"CFBundleIdentifier={identifier}")
          print(f"CFBundleShortVersionString={version}")
          PY

      - name: Stage IPA artifact and metadata
        shell: bash
        working-directory: sidestore
        run: |
          set -euo pipefail
          artifact_dir="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$artifact_dir"
          cp SideStore.ipa "$artifact_dir/SideStore-nightly-extensionkit.ipa"
          (
            cd "$artifact_dir"
            shasum -a 256 SideStore-nightly-extensionkit.ipa > SHA256SUMS.txt
          )
          sidestore_commit="$(git -C "$GITHUB_WORKSPACE/sidestore" rev-parse HEAD)"
          sidesign_commit="$(git -C "$GITHUB_WORKSPACE/sidestore/Dependencies/SideSign" rev-parse HEAD)"
          minimuxer_commit="$(git -C "$GITHUB_WORKSPACE/sidestore/Dependencies/minimuxer" rev-parse HEAD)"
          {
            printf 'sidestore_commit=%s\n' "$sidestore_commit"
            printf 'sidesign_commit=%s\n' "$sidesign_commit"
            printf 'minimuxer_commit=%s\n' "$minimuxer_commit"
            printf 'sidesign_ref=fix/extensionkit-discovery\n'
            printf 'marketing_version=%s\n' "$MARKETING_VERSION"
            printf 'xcodebuild_version:\n'
            xcodebuild -version
          } > "$artifact_dir/build-info.txt"

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-nightly-extensionkit
          path: |
            artifact/SideStore-nightly-extensionkit.ipa
            artifact/SHA256SUMS.txt
            artifact/build-info.txt
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-nightly-extensionkit-logs
          path: sidestore/build/logs
          if-no-files-found: ignore
